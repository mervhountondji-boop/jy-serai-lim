<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>J'y serai LIM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="canvas-box">
      <!-- Le flyer complet (fond) -->
      <img src="flyer.png" id="template" alt="Flyer LIM">
      
      <!-- La photo de l'utilisateur (qui vient par-dessus le rond blanc) -->
      <img id="photoPreview" alt="Photo de l'intervenant">
    </div>

    <div class="controls">
      <input type="file" id="photo" accept="image/*">
      <button onclick="download()">Télécharger mon visuel</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
