<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur J'y serai</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Générateur de visuel</h2>

    <div class="canvas-box">
      <!-- 1. Fond bleu -->
      <img src="fond.png" id="bg" alt="Fond">
      
      <!-- 2. Photo de l'utilisateur -->
      <img id="photoPreview" alt="Aperçu photo">

      <!-- 3. Cadre et textes transparents -->
      <img src="cadre.png" id="overlay" alt="Cadre">
    </div>

    <!-- Zone des boutons (bien séparée pour recevoir les clics) -->
    <div class="controls">
      <input type="file" id="photo" accept="image/*">
      <br><br>
      <button type="button" id="downloadBtn">Télécharger mon visuel</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
