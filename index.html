<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur J'y serai</title>
  
  <style>
    * { box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #1e1e2f;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .container {
      text-align: center;
      padding: 20px;
    }
    .canvas-box {
      position: relative;
      width: 400px;
      height: 500px;
      margin: 0 auto;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    #bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    #photoPreview {
      position: absolute;
      width: 196px;
      height: 196px;
      top: 212px;
      left: 102px;
      border-radius: 50%;
      object-fit: cover;
      z-index: 2;
      display: none;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 3;
      pointer-events: none;
    }
    .controls {
      margin-top: 20px;
    }
    input[type="file"] {
      background: #fff;
      color: #000;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    button {
      background-color: #ffb703;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Créer mon visuel</h2>

    <div class="canvas-box">
      <img src="./fond.png" id="bg" alt="Fond">
      <img id="photoPreview" alt="Aperçu photo">
      <img src="./cadre.png" id="overlay" alt="Cadre">
    </div>

    <div class="controls">
      <input type="file" id="photo" accept="image/*">
      <br><br>
      <button type="button" id="downloadBtn">Télécharger mon visuel</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const input = document.getElementById("photo");
      const preview = document.getElementById("photoPreview");
      const bgImg = document.getElementById("bg");
      const overlayImg = document.getElementById("overlay");
      const downloadBtn = document.getElementById("downloadBtn");

      input.addEventListener("change", function (e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (event) {
            preview.src = event.target.result;
            preview.style.display = "block";
          };
          reader.readAsDataURL(file);
        }
      });

      downloadBtn.addEventListener("click", function () {
        if (!preview.src || preview.style.display === "none") {
          alert("Veuillez d'abord sélectionner une photo !");
          return;
        }

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        const realWidth = bgImg.naturalWidth || 1000;
        const realHeight = bgImg.naturalHeight || 1250;

        canvas.width = realWidth;
        canvas.height = realHeight;

        const scale = realWidth / 400;
        const photoX = 102 * scale;
        const photoY = 212 * scale;
        const photoSize = 196 * scale;

        // 1. Fond
        ctx.drawImage(bgImg, 0, 0, realWidth, realHeight);

        // 2. Photo
        const userImg = new Image();
        userImg.onload = function () {
          ctx.save();
          ctx.beginPath();
          ctx.arc(
            photoX + photoSize / 2,
            photoY + photoSize / 2,
            photoSize / 2,
            0,
            Math.PI * 2
          );
          ctx.closePath();
          ctx.clip();
          ctx.drawImage(userImg, photoX, photoY, photoSize, photoSize);
          ctx.restore();

          // 3. Cadre
          const frameImg = new Image();
          frameImg.onload = function () {
            ctx.drawImage(frameImg, 0, 0, realWidth, realHeight);

            const link = document.createElement("a");
            link.download = "visuel_jy_serai.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
          };
          frameImg.src = overlayImg.src;
        };
        userImg.src = preview.src;
      });
    });
  </script>
</body>
</html>
