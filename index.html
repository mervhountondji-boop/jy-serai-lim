<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur LIM</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="container">
    <h2>Créer mon visuel</h2>

    <!-- Cadre du flyer en sandwich -->
    <div class="canvas-box">
      <!-- Couche 1 : Fond -->
      <img src="./fond.png" id="bg" alt="Fond">
      <!-- Couche 2 : Photo de l'utilisateur -->
      <img id="photoPreview" alt="Aperçu photo">
      <!-- Couche 3 : Cadre par-dessus -->
      <img src="./cadre1.png" id="overlay" alt="Cadre">
    </div>

    <!-- Boutons -->
    <div class="controls">
      <input type="file" id="photo" accept="image/*"><br><br>
      <button type="button" id="downloadBtn">Télécharger mon visuel</button>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
