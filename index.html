<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur J'y serai</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="container">
    <h2>Créer mon visuel</h2>

    <!-- Zone de superposition du flyer -->
    <div class="canvas-box">
      <!-- Couche 1 : Fond bleu -->
      <img src="./fond.png" id="bg" alt="Fond bleu">

      <!-- Couche 2 : Photo de l'utilisateur -->
      <img id="photoPreview" alt="Aperçu photo">

      <!-- Couche 3 : Cadre transparent + textes -->
      <img src="./cadre1.png" id="overlay" alt="Cadre et textes">
    </div>

    <!-- Zone des boutons d'action -->
    <div class="controls">
      <input type="file" id="photo" accept="image/*">
      <br><br>
      <button type="button" id="downloadBtn">Télécharger mon visuel</button>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
