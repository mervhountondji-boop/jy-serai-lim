<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur J'y serai</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Créer mon visuel</h2>

    <div class="canvas-box">
      <!-- Couche 1 : Fond bleu -->
      <img src="fond.png" id="bg" alt="Fond">
      
      <!-- Couche 2 : Photo de l'utilisateur (au milieu) -->
      <img id="photoPreview" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Photo">

      <!-- Couche 3 : Cadre + Écrits (PNG transparent par-dessus) -->
      <img src="cadre.png" id="overlay" alt="Cadre et écrits">
    </div>

    <div class="controls">
      <input type="file" id="photo" accept="image/*">
      <br><br>
      <button id="downloadBtn">Télécharger mon visuel</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
